# Serves the built Angular app and forwards /api calls to the backend container.
# Plays the same role as proxy.conf.json does for "ng serve".
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # "backend" is the service name in docker-compose.yml.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # A collection waits for the LLM to judge and summarize: give it time.
        proxy_read_timeout 600s;
    }

    # Routes such as /settings are handled by Angular: unknown paths get index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
