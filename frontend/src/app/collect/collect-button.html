<button
  type="button"
  class="btn btn-primary"
  [disabled]="collection.running()"
  (click)="collection.collect()"
>
  <svg class="icon" [class.spin]="collection.running()" viewBox="0 0 16 16" aria-hidden="true">
    @if (collection.running()) {
      <path d="M8 2a6 6 0 1 0 6 6" />
    } @else {
      <path d="M8 2v11M3.5 8.5 8 13l4.5-4.5" />
    }
  </svg>
  {{ collection.running() ? i18n.t('collect.running') : i18n.t('collect.button') }}
</button>
