<main>
  <header>
    <h1>MorningDevNews</h1>
    <label>
      {{ i18n.t('language.label') }}
      <select [value]="i18n.language()" (change)="onLanguageChange($event)">
        @for (language of i18n.languages; track language) {
          <option [value]="language">{{ language.toUpperCase() }}</option>
        }
      </select>
    </label>
  </header>
  <p>
    {{ i18n.t('backend.label') }}: <strong>{{ i18n.t(backendStatus()) }}</strong>
  </p>
  <app-collect-button />
  <app-llm-settings />
</main>
