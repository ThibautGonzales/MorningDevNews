<main>
  <header>
    <h1>MorningDevNews</h1>
    <label>
      {{ i18n.t('language.label') }}
      <!-- [selected] on each option rather than [value] on the select: the select's value is set
           before @for creates the options, so the browser would fall back to the first one. -->
      <select (change)="onLanguageChange($event)">
        @for (language of i18n.languages; track language) {
          <option [value]="language" [selected]="language === i18n.language()">
            {{ language.toUpperCase() }}
          </option>
        }
      </select>
    </label>
  </header>
  <p>
    {{ i18n.t('backend.label') }}: <strong>{{ i18n.t(backendStatus()) }}</strong>
  </p>
  <!-- After a collection, the summaries and the list reload to show what it brought. -->
  <app-collect-button (collected)="summaries.reload(); articles.reload()" />
  <app-summaries #summaries />
  <app-relevant-articles #articles />
  <app-llm-settings />
</main>
